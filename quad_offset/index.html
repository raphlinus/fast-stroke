<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Interactive quadratic offset | Xilem Web</title>
    <link data-trunk rel="rust" data-bin="quad_offset" />
    <style>
      body {
        background: #111;
        color: white;
        font-family: monospace;
        margin: 0px;
        padding: 1rem;
      }

      #beztoy-container-inner {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      #offset-control {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      #offset-control label {
        display: inline-block;
        width: 15ch;
      }

      #offset-control input[type="range"] {
        width: 300px;
        accent-color: #f88;
      }

      #beztoy-container-inner circle {
        fill: #07e;
        cursor: grab;
      }
    </style>
  </head>

  <body></body>
</html>
