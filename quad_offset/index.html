<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Interactive quadratic offset | Xilem Web</title>
    <link data-trunk rel="rust" data-bin="quad_offset" />
    <style>
      body {
        background: #111;
        color: white;
        font-family: monospace;
        margin: 0px;
        padding: 1rem;
        min-height: 20rem;
        height: calc(100vh - 2rem);
      }

      button,
      select,
      input[type="text"] {
        background: #222;
        color: #ccc;
        border: 1px solid #ccc;
        border-radius: 2px;
      }

      #beztoy-container-inner circle {
        fill: #07e;
        cursor: grab;
      }

      #beztoy-container-inner circle.extra {
        fill: #f88;
        cursor: grab;
      }
    </style>
  </head>

  <body></body>
</html>
